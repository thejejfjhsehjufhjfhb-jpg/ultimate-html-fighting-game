<div id="update-banner" style="display:none;position:fixed;top:0;left:0;right:0;
  padding:10px;background:#2b7;color:#fff;text-align:center;font-family:sans-serif;z-index:9999"></div>

<script>
const CURRENT_VERSION = "1.0.0";
const VERSION_URL = "https://YOURNAME.github.io/my-game/version.json";

function isNewer(a, b) {            // true if a > b
  const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
  for (let i = 0; i < 3; i++) {
    if ((pa[i] || 0) > (pb[i] || 0)) return true;
    if ((pa[i] || 0) < (pb[i] || 0)) return false;
  }
  return false;
}

async function checkForUpdate() {
  try {
    const res = await fetch(VERSION_URL + "?t=" + Date.now(), { cache: "no-store" });
    const info = await res.json();
    if (isNewer(info.version, CURRENT_VERSION)) {
      const bar = document.getElementById("update-banner");
      bar.innerHTML = `Version ${info.version} is available! ${info.notes || ""}
        <a href="${info.download}" style="color:#fff;font-weight:bold;margin-left:10px">Download</a>`;
      bar.style.display = "block";
    }
  } catch (e) { /* offline: ignore silently */ }
}

checkForUpdate();
setInterval(checkForUpdate, 30 * 60 * 1000);   // re-check every 30 min
</script>
